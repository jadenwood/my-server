# Realm world mood "First Frost" - override lines for the game's built-in Mods system.
#
# Identity: the first cold, clear days of winter. A crisp blue-white light, a bright cold moon, thin
# air and mostly clear skies. A season look, a readable alternative to Long Winter for a new-player
# wave or a server that finds Long Winter too closed in (see mods/moods.md).
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood first-frost, or with
# mods\presets\grim-but-readable\Apply-Preset.ps1 -Mood first-frost. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# A crisp, cold sun: red cut 10% (luminance 0.94).
Atmosphere.SunColor = 'rgba(0.9,0.95,1,1)'
# A bright, cold moon (luminance 0.92).
Atmosphere.MoonColor = 'rgba(0.85,0.93,1,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# A clean frost-blue haze (luminance 0.95).
Atmosphere.FogColor = 'rgba(0.92,0.96,1,1)'
# 0.95: about 5% longer sight in fog. Cold air is clear air.
Atmosphere.FogDensity = '0.95'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 65.3%, cloudy 32.2%, light rain 1.1%, medium rain 1.1%, heavy rain never,
# no change 0.3%. No Mods key exists for snow; any precipitation looks like the game's rain.
Weather.ClearWeight = '6'
Weather.CloudyWeight = '4'
Weather.PrecipitateLowWeight = '1'
Weather.PrecipitateMediumWeight = '1'
Weather.PrecipitateHeavyWeight = '0'
