# Realm world mood "Spring Rains" - override lines for the game's built-in Mods system.
#
# Identity: the realm turning green again. Fresh, faintly green-gold light, a light mist and quick
# showers that come and go; heavy storms never. A season look, an alternative to Grim but Readable
# for the Thaw season (see mods/moods.md).
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood spring-rains, or with
# mods\presets\grim-but-readable\Apply-Preset.ps1 -Mood spring-rains. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# A fresh sun with a hint of green-gold (blue cut 8%), luminance 0.99.
Atmosphere.SunColor = 'rgba(0.98,1,0.92,1)'
# A clear, cool moon (luminance 0.95).
Atmosphere.MoonColor = 'rgba(0.9,0.96,1,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# A faintly green spring mist (luminance 0.95).
Atmosphere.FogColor = 'rgba(0.9,0.97,0.92,1)'
# 1.1: about 9% shorter sight in fog.
Atmosphere.FogDensity = '1.1'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 21.3%, cloudy 21.3%, light rain 54.5%, medium rain 2.1%, heavy rain never,
# no change 0.7%. Showers most of the time, never a storm.
Weather.ClearWeight = '4'
Weather.CloudyWeight = '4'
Weather.PrecipitateLowWeight = '6'
Weather.PrecipitateMediumWeight = '2'
Weather.PrecipitateHeavyWeight = '0'
