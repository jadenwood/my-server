# Realm world mood "Long Winter" - override lines for the game's built-in Mods system.
#
# Identity: the hungry months before the Long Thaw. Pale cold light, low grey skies, frequent rain and
# icy fog. Sight lines shrink; a bright cold moon keeps nights playable.
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood long-winter (it backs up Mods\ first and only writes keys the server
# itself lists in Mods\*.defaults.cfg). See mods/moods.md.
#
# Parser rules (decompiled SimplifiedProperties.PropertyFile): keep a space before '='; keys are
# case-sensitive; never repeat a key; dot decimals (UNVERIFIED on a comma-decimal Windows locale).
# Colour values assume the scene defaults are white and FogDensity 1 (the C# initializers);
# UNVERIFIED for the real scene, Set-Mood.ps1 prints the server's defaults and warns on a mismatch.

# ---- Fog --------------------------------------------------------------------------------------------
# 1.35: fog visibility / 1.35, about 26% shorter sight in fog. Rain shortens it further
# (FogVolumeController.RainyWeatherVisibility), which is why this stays below 1.4.
Atmosphere.FogDensity = '1.35'
# Pale icy blue: multiplies each biome's fog colour, red pulled down 14%, blue untouched.
Atmosphere.FogColor = 'rgba(0.86,0.92,1,1)'

# ---- Light ------------------------------------------------------------------------------------------
# Thin, cold sun: about 11% dimmer than white (relative luminance 0.89), shifted to blue.
Atmosphere.SunColor = 'rgba(0.82,0.9,1,1)'
# Bright cold "snow moon": luminance 0.89. Kept brighter than grim-but-readable on purpose: the fog
# and cloud cover already darken nights, so the moon is the readability anchor.
Atmosphere.MoonColor = 'rgba(0.8,0.9,1,1)'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per weather change (exact, from Weather.ChangeTheWeather): clear 8.9%, cloudy 56.5%,
# light rain 23.5%, medium rain 8.9%, heavy rain 1.5%, no change 0.6%.
# Precipitation renders as the game's rain; whether this map can show snow is UNVERIFIED and no Mods
# key for snow exists.
Weather.ClearWeight = '3'
Weather.CloudyWeight = '6'
Weather.PrecipitateLowWeight = '4'
Weather.PrecipitateMediumWeight = '3'
Weather.PrecipitateHeavyWeight = '2'

# Not changed: Clock.DaySpeed (no night-only key exists; slowing the whole cycle would also lengthen
# the grey days), Atmosphere.IslandLatitude/IslandLongitude (would move the sun's path; a higher
# latitude would give a lower winter sun but its effect on this map is UNVERIFIED).
