# Realm world mood "Golden Summer" - override lines for the game's built-in Mods system.
#
# Identity: harvest season. Warm honey sunlight, thin haze, long sight lines, almost no rain and
# slightly longer days. The "easy" mood: good for new-player waves, tournaments and building weeks.
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood golden-summer. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# Warm golden sun: blue cut 18%, luminance 0.95.
Atmosphere.SunColor = 'rgba(1,0.95,0.82,1)'
# Clear, nearly white moon (luminance 0.95): summer nights are the brightest of any mood.
Atmosphere.MoonColor = 'rgba(0.95,0.95,1,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# Warm haze tint.
Atmosphere.FogColor = 'rgba(1,0.97,0.9,1)'
# 0.85: fog visibility / 0.85, about 18% LONGER sight in fog. The only mood that thins fog.
Atmosphere.FogDensity = '0.85'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 80.2%, cloudy 18.2%, light rain 1.5%, medium and heavy rain never,
# no change 0.1%.
Weather.ClearWeight = '8'
Weather.CloudyWeight = '3'
Weather.PrecipitateLowWeight = '1'
Weather.PrecipitateMediumWeight = '0'
Weather.PrecipitateHeavyWeight = '0'

# ---- Clock (relative) -------------------------------------------------------------------------------
# A Set-Mood.ps1 directive, NOT a game line (the game reads it as a comment): Set-Mood.ps1 reads the
# server's own Clock.DaySpeed default from Mods\*.defaults.cfg, multiplies it by 0.9 and writes the
# literal result. Relative because the scene's real DaySpeed is UNVERIFIED (code default 1): writing a
# literal 0.9 onto a scene that runs at, say, 12 would make days 13x longer. 0.9 = the whole cycle,
# day AND night, runs 10% slower (no day-only key exists). Copying this file by hand skips it.
#@scale Clock.DaySpeed = '0.9'
