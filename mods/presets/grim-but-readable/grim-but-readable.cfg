# Realm preset "grim but readable" - override lines for the game's built-in Mods system.
#
# Identity: the baseline. Cool grey light, a little more fog, mixed weather with rare storms; nights stay
# bright enough to see another player at 30 to 40 m. The Thaw season and the default between arcs.
#
# Every key below was read out of the game's own code (docs/mods-keys-from-dll.md). The line format
# (key = 'value') is the one the game's own file writer produces.
#
# UNVERIFIED: which Mods\<Name>.cfg file these lines belong in. The file name comes from Unity scene
# data, not from the DLL. Apply-Preset.ps1 (next to this file) finds the right file automatically by
# looking up each key in Mods\*.defaults.cfg. To do it by hand, see mods/README.md.
#
# Rules the game's parser imposes (decompiled SimplifiedProperties.PropertyFile):
#   - keep a space before '=' (the parser drops the character right before '=');
#   - keys are case-sensitive; a key that appears twice is renamed key2 and ignored;
#   - numbers use a dot as the decimal point (UNVERIFIED on a server running a comma-decimal locale).
#
# Values assume the scene defaults are white colours and FogDensity 1 (the C# initializers in the
# DLL). UNVERIFIED for the real scene: compare with Mods\*.defaults.cfg; Apply-Preset.ps1 warns.

# ---- Fog --------------------------------------------------------------------------------------------
# FogDensity divides fog visibility: 1.25 means about 20% shorter sight distance in fog.
Atmosphere.FogDensity = '1.25'
# FogColor multiplies the biome fog colour: a slight cool grey-blue, about 5% darker.
Atmosphere.FogColor = 'rgba(0.9,0.93,0.98,1)'

# ---- Light ------------------------------------------------------------------------------------------
# MoonColor sets the moonlight and the moon disc colour: cooler and about 10% dimmer than white.
Atmosphere.MoonColor = 'rgba(0.84,0.91,1,1)'
# SunColor sets the sunlight and the sun disc colour: very slightly greyed and cooled, about 6% dimmer.
Atmosphere.SunColor = 'rgba(0.95,0.94,0.91,1)'

# ---- Weather ----------------------------------------------------------------------------------------
# Weights (whole numbers, the editor range is 0-10). For each weather change the game multiplies every
# weight by a random 0-99 and picks the highest. With these weights the odds per change are about:
# clear 23%, cloudy 43%, light rain 23%, medium rain 8%, heavy rain 1.3%, no change 0.6%.
Weather.ClearWeight = '4'
Weather.CloudyWeight = '5'
Weather.PrecipitateLowWeight = '4'
Weather.PrecipitateMediumWeight = '3'
Weather.PrecipitateHeavyWeight = '2'

# Not changed on purpose: Clock.DaySpeed (no separate dusk key exists, so the whole cycle stays at its
# default), Atmosphere.IslandLatitude and Atmosphere.IslandLongitude (they move the sun's path).
