# Realm world mood "Ashfall" - override lines for the game's built-in Mods system.
#
# Identity: the sky after the burning. Thick brown-grey haze, an orange smothered sun, a dusty amber
# moon and dry, overcast weather (no rain to wash the ash out). The heaviest fog of any mood, so it
# suits short war arcs, not a whole season of new players.
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood ashfall. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Fog --------------------------------------------------------------------------------------------
# 1.45: fog visibility / 1.45, about 31% shorter sight. The highest any mood uses; Set-Mood.ps1
# refuses anything above 1.5. Safe here only because rain (which cuts visibility again) is rare.
Atmosphere.FogDensity = '1.45'
# Ash: brown-grey, multiplies each biome's fog colour (luminance 0.75).
Atmosphere.FogColor = 'rgba(0.8,0.74,0.68,1)'

# ---- Light ------------------------------------------------------------------------------------------
# Smothered orange sun: blue cut 40%, luminance 0.81.
Atmosphere.SunColor = 'rgba(1,0.78,0.6,1)'
# Dusty amber moon, luminance 0.82.
Atmosphere.MoonColor = 'rgba(0.92,0.8,0.7,1)'

# ---- Weather ----------------------------------------------------------------------------------------
# Dry and overcast. Odds per change: clear 20.8%, cloudy 77.4%, light rain 1.7%, medium and heavy
# rain never, no change 0.2%.
Weather.ClearWeight = '3'
Weather.CloudyWeight = '7'
Weather.PrecipitateLowWeight = '1'
Weather.PrecipitateMediumWeight = '0'
Weather.PrecipitateHeavyWeight = '0'
