# Realm world mood "Storm Season" - override lines for the game's built-in Mods system.
#
# Identity: the autumn gales. Rain most of the time, slate-grey light, wet fog. Clear skies are rare
# enough that players notice them. Ambushes and sieges in the rain; scouting matters.
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood storm-season. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 0.5%, cloudy 8.8%, light rain 35.0%, medium rain 35.0%, heavy rain 20.0%,
# no change 0.8%. Heavy rain is deliberately not the favourite: at full cloud the game already
# multiplies sun and moon light by 0.47 (1.12 - 0.65), and rain also cuts fog visibility.
Weather.ClearWeight = '2'
Weather.CloudyWeight = '4'
Weather.PrecipitateLowWeight = '6'
Weather.PrecipitateMediumWeight = '6'
Weather.PrecipitateHeavyWeight = '5'

# ---- Fog --------------------------------------------------------------------------------------------
# Only 1.2 (about 17% shorter sight): rain stacks its own visibility cut on top of this.
Atmosphere.FogDensity = '1.2'
# Wet slate-blue fog.
Atmosphere.FogColor = 'rgba(0.82,0.86,0.92,1)'

# ---- Light ------------------------------------------------------------------------------------------
# Slate daylight, luminance 0.88. Not dimmed further: cloud occlusion does that in the game itself.
Atmosphere.SunColor = 'rgba(0.85,0.88,0.94,1)'
# Brighter-than-grim moon (luminance 0.92) to offset almost permanent cloud at night.
Atmosphere.MoonColor = 'rgba(0.88,0.92,1,1)'
