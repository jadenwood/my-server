# Realm world mood "Hunter's Moon" - override lines for the game's built-in Mods system.
#
# Identity: late autumn after the harvest. A low copper moon, amber afternoons, mist in the valleys
# and grey days between, but no storms. A season look, an alternative to Storm Season for an
# autumn that should be moody rather than wet (see mods/moods.md). It also suits a King's Hunt week.
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood hunters-moon, or with
# mods\presets\grim-but-readable\Apply-Preset.ps1 -Mood hunters-moon. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# A copper moon (light and disc): green cut 22%, blue cut 45%, luminance 0.81. Red kept full, so
# silhouettes still read at night.
Atmosphere.MoonColor = 'rgba(1,0.78,0.55,1)'
# An amber afternoon sun (luminance 0.91).
Atmosphere.SunColor = 'rgba(1,0.9,0.76,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# A warm grey-amber valley mist (luminance 0.91).
Atmosphere.FogColor = 'rgba(0.96,0.9,0.8,1)'
# 1.2: about 17% shorter sight in fog. Hunting country: closer, quieter sight lines.
Atmosphere.FogDensity = '1.2'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 43.4%, cloudy 43.4%, light rain 11.9%, medium rain 0.3%, heavy rain never,
# no change 0.8%.
Weather.ClearWeight = '5'
Weather.CloudyWeight = '5'
Weather.PrecipitateLowWeight = '3'
Weather.PrecipitateMediumWeight = '1'
Weather.PrecipitateHeavyWeight = '0'
