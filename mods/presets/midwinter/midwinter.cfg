# Realm world mood "Midwinter" - override lines for the game's built-in Mods system.
#
# Identity: the longest nights of the year, kept with fires and feasting. A silver-blue moon bright
# enough to walk by, a pale cold sun, a thin frost haze and mostly clear, still skies. The overlay for
# RealmWorld's Midwinter festival (a week from 20 December by default). Not a season: Long Winter and
# First Frost are the winter season moods (see mods/moods.md).
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Event midwinter (or -Mood midwinter), or with
# mods\presets\grim-but-readable\Apply-Preset.ps1 -Mood midwinter. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# A silver-blue moon (light and disc), luminance 0.91: festival nights are for walking between halls,
# so the moon is kept bright.
Atmosphere.MoonColor = 'rgba(0.85,0.92,1,1)'
# A pale, cold sun (luminance 0.94).
Atmosphere.SunColor = 'rgba(0.9,0.94,1,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# A clean frost haze (luminance 0.95).
Atmosphere.FogColor = 'rgba(0.92,0.95,1,1)'
# 1.15: about 13% shorter sight in fog. Cold air, breath and hearth smoke.
Atmosphere.FogDensity = '1.15'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 63.5%, cloudy 30.5%, light rain 5.6%, medium and heavy rain never,
# no change 0.4%. No Mods key exists for snow, so what falls looks like the game's rain (UNVERIFIED).
Weather.ClearWeight = '6'
Weather.CloudyWeight = '4'
Weather.PrecipitateLowWeight = '2'
Weather.PrecipitateMediumWeight = '0'
Weather.PrecipitateHeavyWeight = '0'
