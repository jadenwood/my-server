# Realm world mood "Blood Moon" - override lines for the game's built-in Mods system.
#
# Identity: a red moon over Ostreval. Nights are lit a deep rust red; skies are kept mostly clear so
# the moon is actually seen. Days stay close to normal with a faint warm cast. Meant as a short
# overlay for Crown Night weekends and season finales, not a whole season (see mods/moods.md).
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Mood blood-moon. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# The red moon. MoonColor sets the moonlight AND the moon disc (TOD_Sky.Moon LightColor + MeshColor).
# Relative luminance 0.60: the darkest moon any Realm mood uses. Set-Mood.ps1 refuses a moon below
# 0.55, the readability floor. Green and blue are cut, red kept full, so silhouettes still read.
Atmosphere.MoonColor = 'rgba(1,0.5,0.42,1)'
# A faintly ember-warm sun (luminance 0.94), so the day before a blood moon feels slightly wrong.
Atmosphere.SunColor = 'rgba(1,0.93,0.86,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# Rose-tinted fog. FogColor applies day and night alike, so it is kept subtle (blue down 16%).
Atmosphere.FogColor = 'rgba(1,0.88,0.84,1)'
# Light thickening only (about 9% shorter sight): the red light is the effect, not the fog.
Atmosphere.FogDensity = '1.1'

# ---- Weather ----------------------------------------------------------------------------------------
# Mostly clear, so cloud occlusion does not hide the moon (light = colour * (1.12 - 0.65 * cloud)).
# Odds per change: clear 73.6%, cloudy 24.0%, light rain 1.9%, medium and heavy rain never
# (a weight of 0 can never win the strictly-highest roll), no change 0.5%.
Weather.ClearWeight = '6'
Weather.CloudyWeight = '3'
Weather.PrecipitateLowWeight = '1'
Weather.PrecipitateMediumWeight = '0'
Weather.PrecipitateHeavyWeight = '0'
