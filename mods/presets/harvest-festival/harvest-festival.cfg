# Realm world mood "Harvest Fair" - override lines for the game's built-in Mods system.
#
# Identity: the week the houses bring in the harvest. A low amber sun, a great orange harvest moon, a
# warm golden haze over the fields and dry, mostly clear skies. The overlay for RealmWorld's Harvest
# Fair (a week from 22 September by default); Golden Summer stays the season look (see mods/moods.md).
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Event harvest_festival (or -Mood harvest-festival), or with
# mods\presets\grim-but-readable\Apply-Preset.ps1 -Mood harvest-festival. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# The harvest moon (light and disc): green cut 16%, blue cut 38%, luminance 0.86. Red kept full, so
# the fairground and its banners still read at night.
Atmosphere.MoonColor = 'rgba(1,0.84,0.62,1)'
# A low amber sun, warmer than Golden Summer's (luminance 0.91).
Atmosphere.SunColor = 'rgba(1,0.9,0.72,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# A warm golden haze over the fields (luminance 0.95).
Atmosphere.FogColor = 'rgba(1,0.94,0.84,1)'
# 1.05: about 5% shorter sight in fog; chaff and dust in the air, not a wall.
Atmosphere.FogDensity = '1.05'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 70.5%, cloudy 28.1%, light rain 1.3%, medium and heavy rain never,
# no change 0.2%. A fair is held under open skies.
Weather.ClearWeight = '7'
Weather.CloudyWeight = '4'
Weather.PrecipitateLowWeight = '1'
Weather.PrecipitateMediumWeight = '0'
Weather.PrecipitateHeavyWeight = '0'
