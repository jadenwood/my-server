# Realm world mood "Crown Night" - override lines for the game's built-in Mods system.
#
# Identity: the night the Old Throne is fought for. A gold moon over a violet haze, clear skies, and
# slightly clearer air than usual, so a contested throne room reads from a distance and on stream.
# The weekly overlay for Crown Night (RealmEvents' crown_night). Blood Moon stays the rarer, darker
# finale look (see mods/moods.md).
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Event crown_night (or -Mood crown-night), or with
# mods\presets\grim-but-readable\Apply-Preset.ps1 -Mood crown-night. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# A gold moon (light and disc): blue cut 30%, luminance 0.92. Bright on purpose: Crown Night is a fight
# at night, and the fight has to be seen.
Atmosphere.MoonColor = 'rgba(1,0.92,0.7,1)'
# A warm dusk-coloured sun for the hours before the fight (luminance 0.93).
Atmosphere.SunColor = 'rgba(1,0.92,0.84,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# A faint royal-violet haze (luminance 0.88): green cut 14%, blue kept high.
Atmosphere.FogColor = 'rgba(0.9,0.86,0.96,1)'
# 0.95: about 5% longer sight in fog than the default.
Atmosphere.FogDensity = '0.95'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 77.4%, cloudy 20.8%, light rain 1.7%, medium and heavy rain never,
# no change 0.2%. Cloud would dim the gold moon (light = colour * (1.12 - 0.65 * cloud)).
Weather.ClearWeight = '7'
Weather.CloudyWeight = '3'
Weather.PrecipitateLowWeight = '1'
Weather.PrecipitateMediumWeight = '0'
Weather.PrecipitateHeavyWeight = '0'
