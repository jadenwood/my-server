# Realm world mood "Truce" - override lines for the game's built-in Mods system.
#
# Identity: the realm holds its breath. Soft, pale, almost white light by day and night, thin air and
# a sky that never rains. Calm enough to ride out to parley. An overlay for a scheduled Truce of the
# Realm long enough to plan a restart around (a truce day, peace talks, a season break). A short
# truce needs no mood.
#
# Every key below is proven from the game's code (docs/mods-keys-from-dll.md). Install with
# server\Set-Mood.ps1 -Event truce (or -Mood truce), or with
# mods\presets\grim-but-readable\Apply-Preset.ps1 -Mood truce. See mods/moods.md.
#
# Parser rules: keep a space before '='; keys are case-sensitive; never repeat a key; dot decimals
# (UNVERIFIED on a comma-decimal locale). Colours assume white scene defaults (UNVERIFIED).

# ---- Light ------------------------------------------------------------------------------------------
# A soft, very slightly warm sun (luminance 0.98): the closest to plain white of any mood.
Atmosphere.SunColor = 'rgba(1,0.98,0.95,1)'
# A pale silver moon (luminance 0.96).
Atmosphere.MoonColor = 'rgba(0.94,0.96,1,1)'

# ---- Fog --------------------------------------------------------------------------------------------
# A clean, faintly cool haze (luminance 0.97).
Atmosphere.FogColor = 'rgba(0.96,0.97,1,1)'
# 0.9: about 11% longer sight in fog. Riders under a banner of truce should be seen coming.
Atmosphere.FogDensity = '0.9'

# ---- Weather ----------------------------------------------------------------------------------------
# Odds per change: clear 58.2%, cloudy 41.7%, no rain at all (every rain weight is 0), no change 0.2%.
Weather.ClearWeight = '6'
Weather.CloudyWeight = '5'
Weather.PrecipitateLowWeight = '0'
Weather.PrecipitateMediumWeight = '0'
Weather.PrecipitateHeavyWeight = '0'
