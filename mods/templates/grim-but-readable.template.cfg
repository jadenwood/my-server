# Realm atmosphere preset: "grim but readable"  (TEMPLATE, not a working override file)
#
# Every key name below is a PLACEHOLDER. No atmosphere key name or Mods file name (other than
# Players.cfg / Players.defaults.cfg) has been verified; see docs/server-reference.md section 5.
# Do not copy this file into the server as-is. Fill it in from docs/mods-keys.txt, produced on the
# owner's PC by server/Export-ModKeys.ps1, following mods/README.md.
#
# How to fill one entry:
#   1. Find the matching line in the real <Name>.defaults.cfg.
#   2. Paste THE ENTIRE LINE into the matching <Name>.cfg in the server's Mods folder (not .defaults.cfg).
#   3. Change only the value, using the target given here relative to the default value.
#   4. Restart the server.
#
# Goal: darker and moodier than vanilla, but players can still see a player 30-40 m away at night
# and read a sigil on a banner at dusk. If a change hurts that, back it off.

# ---- Fog -------------------------------------------------------------------------------------------
# Target: fog density about +30% over default (try +20% first if nights become unreadable).
# Target: fog colour shifted slightly toward cool grey-blue; keep brightness close to default.
# <FOG_DENSITY_LINE>      e.g. from <ENVIRONMENT_FILE>.defaults.cfg
# <FOG_COLOR_LINE>

# ---- Moonlight -------------------------------------------------------------------------------------
# Target: moon light colour cooler (more blue, less yellow). Keep intensity at default or at most -10%,
# so nights stay readable.
# <MOON_COLOR_LINE>
# <MOON_INTENSITY_LINE>   only if such a key exists

# ---- Day / night cycle -----------------------------------------------------------------------------
# Target: dusk slightly longer, about +15-25% of its default length.
# If there is no separate dusk key, do NOT slow the whole day/night cycle for this; leave it at default.
# <DUSK_LENGTH_LINE>      only if such a key exists
# <DAY_NIGHT_SPEED_LINE>  leave at default unless agreed

# ---- Weather ---------------------------------------------------------------------------------------
# Target: storms/rain more frequent, about 1.5x default chance; clear weather a bit rarer.
# Keep at least some clear periods so building and sieges are not always in rain.
# <STORM_CHANCE_LINE>
# <RAIN_CHANCE_LINE>
# <CLEAR_CHANCE_LINE>

# ---- Sun / ambient ---------------------------------------------------------------------------------
# Target: sunlight colour very slightly desaturated. Ambient light at default: lowering it is the
# fastest way to make the game unreadable.
# <SUN_COLOR_LINE>
