<svg xmlns="http://www.w3.org/2000/svg" data-field="#24472d" data-house="Merrin" data-metal="#c9ced4" viewBox="0 0 256 256">
  <title>House Merrin: the Silver Eel</title>
  <desc>
    A silver eel coiled through a broken net, on a deep green field. Original artwork for the Realm of Ostreval.
  </desc>
  <defs>
    <radialGradient id="merrin-field" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#47644f"/>
      <stop offset=".6" stop-color="#24472d"/>
      <stop offset="1" stop-color="#162c1c"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="126" fill="#131417"/>
  <circle cx="128" cy="128" r="118" fill="url(#merrin-field)"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#d6a043" stroke-width="3"/>
  <g id="charge" transform="translate(28 24)">
<!--the broken net-->
    <path fill="none" stroke="#9fb3a4" stroke-linecap="round" stroke-width="3" d="m102 30 72 72m-148 0 72-72m-23 4 95 95m-140 0 95-95M55 45l29 29m46 46 29 29m-118 0 29-29m46-46 29-29M40 61l29 29m45 45 29 29m-86 0 29-29m45-45 29-29M29 82l93 93m-44 0 93-93M26 109l69 69m10 0 69-69"/>
<!--the eel, slipping through-->
    <path fill="none" stroke="#c9ced4" stroke-linecap="round" stroke-width="15" d="M62 40c48-14 88 10 70 46-14 26-70 20-62 56 6 24 42 30 68 18"/>
    <path fill="none" stroke="#c9ced4" stroke-linecap="round" stroke-width="8" d="M138 160c10-4 18-10 26-20"/>
    <path fill="none" stroke="#c9ced4" stroke-linecap="round" stroke-width="4" d="m164 140 8-12"/>
    <path fill="none" stroke="#24472d" stroke-linecap="round" stroke-width="2" d="M80 36c32-4 60 16 48 44m0 12c-18 16-52 18-50 46"/>
    <path fill="#c9ced4" d="M48 40c2-10 14-14 24-10v20c-10 2-22-2-24-10"/>
    <circle cx="58" cy="37" r="3" fill="#24472d"/>
    <path fill="none" stroke="#24472d" stroke-linecap="round" stroke-width="2" d="m48 41 8 1"/>
<!--strands that pass over the eel, so it reads as slipping through-->
    <path fill="none" stroke="#9fb3a4" stroke-linecap="round" stroke-width="3" d="m125 34-21 21m-63 94 29-29m28-90 18 18"/>
<!--frayed ends at the tear-->
    <path fill="none" stroke="#9fb3a4" stroke-linecap="round" stroke-width="2" d="m84 74 6 2m26-2-2 6m0 55-6-2m-22 2 2-6"/>
  </g>
</svg>
