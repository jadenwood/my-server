<svg xmlns="http://www.w3.org/2000/svg" data-field="#5a5a22" data-house="Dunmere" data-metal="#e0b56a" viewBox="0 0 256 256">
  <title>House Dunmere: the Drowned Bell</title>
  <desc>
    A bronze bell sunk beneath three wavy lines, on an olive field. Original artwork for the Realm of Ostreval.
  </desc>
  <defs>
    <radialGradient id="dunmere-field" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#747445"/>
      <stop offset=".6" stop-color="#5a5a22"/>
      <stop offset="1" stop-color="#383815"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="126" fill="#131417"/>
  <circle cx="128" cy="128" r="118" fill="url(#dunmere-field)"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#d6a043" stroke-width="3"/>
  <g id="charge" transform="translate(28 28)">
    <defs>
      <linearGradient id="dunmere-bronze" x1="0" x2="1">
        <stop offset="0" stop-color="#6e4c22"/>
        <stop offset=".45" stop-color="#e0b56a"/>
        <stop offset="1" stop-color="#6e4c22"/>
      </linearGradient>
    </defs>
<!--three waves-->
    <g fill="none" stroke="#c9d1b0" stroke-linecap="round" stroke-width="7">
      <path d="M30 34q18-15 36 0c18 15 24 10 36 0s24-10 36 0 24 10 32 2"/>
      <path d="M30 56q18-15 36 0c18 15 24 10 36 0s24-10 36 0 24 10 32 2"/>
      <path d="M30 78q18-15 36 0c18 15 24 10 36 0s24-10 36 0 24 10 32 2"/>
    </g>
<!--the bell, sunk below-->
    <path fill="url(#dunmere-bronze)" stroke="#383815" stroke-linejoin="round" stroke-width="3" d="M100 96c14 0 24 8 26 24 2 20 6 36 20 48l4 8H50l4-8c14-12 18-28 20-48 2-16 12-24 26-24Z"/>
    <path fill="none" stroke="#383815" stroke-width="3" d="M58 166h84"/>
    <rect width="12" height="10" x="94" y="88" fill="url(#dunmere-bronze)" stroke="#383815" stroke-width="2" rx="3"/>
    <circle cx="100" cy="184" r="8" fill="#e0b56a" stroke="#383815" stroke-width="2"/>
    <path fill="none" stroke="#e2c38a" stroke-linecap="round" stroke-width="2.5" d="M88 108c-4 12-4 32-10 48" opacity=".7"/>
  </g>
</svg>
