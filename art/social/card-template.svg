<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Realm social card template</title>
  <desc>
    Open Graph / Discord embed card, 1200 x 630. Replace the {{...}} slots by hand, or run: node art/tools/build.mjs card --house &lt;house&gt; --kicker .. --title .. --subtitle .. --footer .. --out card.svg --png card.png. Text uses Cinzel and EB Garamond (OFL); export to PNG before posting.
  </desc>
  <defs>
    <linearGradient id="card-bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#26282d"/>
      <stop offset=".55" stop-color="#131417"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="card-wm-gold" x1="0" x2="0" y1="0" y2="88.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbe3a2"/>
      <stop offset=".35" stop-color="#f4c96d"/>
      <stop offset=".6" stop-color="#d6a043"/>
      <stop offset="1" stop-color="#9c6a1e"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0" stop-color="#d6a043" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d6a043" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="url(#card-bg)" d="M0 0h1200v630H0z"/>
  <path fill="url(#card-glow)" d="M0 0h1200v630H0z"/>
  <path fill="none" stroke="#d6a043" stroke-width="2" d="M24 24h1152v582H24z" opacity=".55"/>
  <svg width="56" height="56" x="72" y="62" viewBox="0 0 256 256">
    <defs>
      <radialGradient id="realm-iron-mark" cx="50%" cy="38%" r="65%">
        <stop offset="0" stop-color="#34363c"/>
        <stop offset=".7" stop-color="#1b1c20"/>
        <stop offset="1" stop-color="#0c0d0f"/>
      </radialGradient>
      <linearGradient id="realm-gold-mark" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#fbe3a2"/>
        <stop offset=".35" stop-color="#f4c96d"/>
        <stop offset=".6" stop-color="#d6a043"/>
        <stop offset="1" stop-color="#9c6a1e"/>
      </linearGradient>
    </defs>
    <circle cx="128" cy="128" r="126" fill="#0c0d0f"/>
    <circle cx="128" cy="128" r="120" fill="url(#realm-iron-mark)"/>
    <circle cx="128" cy="128" r="111" fill="none" stroke="url(#realm-gold-mark)" stroke-width="4"/>
    <circle cx="128" cy="128" r="104" fill="none" stroke="#d6a043" stroke-width="1.5" opacity=".45"/>
    <g id="throne-mark" fill="url(#realm-gold-mark)">
<!--the throne back: a pointed arch of black stone, picked out in gold-->
      <path fill-rule="evenodd" d="M86 170V98c0-26 18-44 42-60 24 16 42 34 42 60v72Zm14-12v-58c0-16 12-28 28-40 16 12 28 24 28 40v58Z"/>
<!--finial-->
      <path d="m128 22 6 12-6 6-6-6Z"/>
<!--the crown resting in the arch-->
      <path d="m108 134-3-32 12 10 11-20 11 20 12-10-3 32Z"/>
      <rect width="44" height="7" x="106" y="138" rx="1.5"/>
<!--arms and seat-->
      <rect width="14" height="44" x="66" y="132" rx="2"/>
      <rect width="14" height="44" x="176" y="132" rx="2"/>
      <rect width="22" height="8" x="62" y="126" rx="2"/>
      <rect width="22" height="8" x="172" y="126" rx="2"/>
      <rect width="124" height="12" x="66" y="166" rx="2"/>
<!--steps of the throne hill-->
      <rect width="144" height="9" x="56" y="186" rx="2"/>
      <rect width="168" height="9" x="44" y="201" rx="2"/>
    </g>
    <circle cx="128" cy="122" r="3.5" fill="#0c0d0f"/>
  </svg>
