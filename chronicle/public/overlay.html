<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realm Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,500;1,500&display=swap">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/overlay.css">
</head>
<body>
  <!-- 1920x1080 stage; transparent everywhere except the panels. Scaled to fit the browser source. -->
  <div id="stage">
    <section id="crown" class="crown-plate iron" aria-live="polite">
      <div class="medallion"><span id="crown-icon"></span></div>
      <div class="crown-text">
        <div class="eyebrow">The Crown of the Realm</div>
        <div id="king" class="king gold-text">&nbsp;</div>
        <div id="reign" class="reign">&nbsp;</div>
        <div class="crown-foot">
          <span id="souls" class="souls"></span>
          <span id="ravens" class="ravens" hidden>The ravens are late</span>
        </div>
      </div>
    </section>

    <section id="banners" class="banners" aria-label="Great houses"></section>

    <section id="proclamations" class="proclamations" aria-live="assertive"></section>

    <section id="ticker" class="ticker iron" aria-label="Latest from the chronicle">
      <div class="plaque"><span id="ticker-icon"></span><span>The Chronicle</span></div>
      <div class="track"><div id="ticker-run" class="run"></div></div>
    </section>
  </div>
  <script type="module" src="/assets/overlay.js"></script>
</body>
</html>
